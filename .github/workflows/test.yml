name: "Test"

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

# Least privilege: these jobs only read the repo (checkout + test).
permissions:
  contents: read

jobs:
  test:
    name: "Pytest + mypy"
    runs-on: "ubuntu-latest"
    steps:
        - name: "Checkout the repository"
          uses: "actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0" # v7.0.0
          with:
            persist-credentials: false

        - name: "Set up uv"
          uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
          with:
            python-version: "3.14"
            enable-cache: true

        - name: "Install dependencies"
          run: uv sync

        - name: "Type check"
          run: uv run mypy

        - name: "Unit tests"
          run: uv run pytest tests/
